services:
  - type: web
    name: rural-vet-ai
    env: node
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      # v9 — in produzione restringi all'origine esatta del frontend
      # (es. "https://tuonome.github.io"); "*" va bene solo per i primi test.
      - key: ALLOWED_ORIGIN
        value: "*"
      - key: OPENAI_API_KEY
        sync: false
      # Sync cloud sicuro: Render ti chiederà questi due valori al deploy.
      # Copia binId e (nuova) master key da jsonbin.io, poi RUOTA la vecchia chiave:
      # quella incorporata nell'HTML storico è da considerare compromessa.
      - key: JSONBIN_BIN_ID
        sync: false
      - key: JSONBIN_API_KEY
        sync: false
      # v9 — segreto per firmare token di accesso e bozze AI.
      # Metti una stringa lunga e casuale (es. 64 caratteri esadecimali).
      # Se lo cambi, tutti dovranno rifare il login: nessun altro effetto.
      - key: RV_AI_SECRET
        sync: false
